{{ define "main" }}
<div class="intro-content">
    {{ .Content }}
</div>

<ul class="post-list">
    <!-- Filters to only show posts, ignoring the _index.md itself -->
    {{ range where .Site.RegularPages "Section" "posts" }}
    <li>
        <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
        <a href="{{ .Permalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
</ul>
{{ end }}
